name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: AppWarden
  OUTPUT_DIR: dist

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        shell: powershell
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: ${{ env.OUTPUT_DIR }}/${{ env.APP_NAME }}.exe
      - name: Actualizar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Última versión
          body: Compilación automática del último commit.
          files: ${{ env.OUTPUT_DIR }}/${{ env.APP_NAME }}.exe
